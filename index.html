<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Victoria Falls — Premium Lifestyle Goods</title>
  <meta name="description" content="Premium minimalist Victoria Falls lifestyle goods: heavyweight t-shirts, enamel mugs and fine art posters. Checkout through Zvakho WhatsApp." />
  <link rel="preload" href="assets/images/victoria-falls-stone-olive-tee-front.webp" as="image" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header" aria-label="Site header">
    <a class="brand" href="#top" aria-label="Victoria Falls home">
      <span>VICTORIA</span><span>FALLS</span>
    </a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="#collection">Shop</a>
      <button class="nav-cart" id="cartButton" type="button" aria-label="Open cart">Cart <span id="cartCount">0</span></button>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-label="Victoria Falls hero collection">
      <div class="hero-carousel" aria-label="T-shirt image carousel">
        <button class="carousel-control prev" type="button" aria-label="Previous image">‹</button>
        <div class="carousel-track" id="heroTrack">
          <img src="assets/images/victoria-falls-stone-olive-tee-front.webp" alt="Stone olive Victoria Falls t-shirt front" />
          <img src="assets/images/victoria-falls-stone-olive-tee-back.webp" alt="Stone olive Victoria Falls t-shirt back" />
          <img src="assets/images/victoria-falls-tee-model-front-stone-olive.webp" alt="Model wearing stone olive Victoria Falls t-shirt front" />
          <img src="assets/images/victoria-falls-tee-model-back-stone-olive.webp" alt="Model wearing stone olive Victoria Falls t-shirt back" />
          <img src="assets/images/victoria-falls-sand-tee-front.webp" alt="Sand Victoria Falls t-shirt front" />
          <img src="assets/images/victoria-falls-sand-tee-back.webp" alt="Sand Victoria Falls t-shirt back" />
        </div>
        <button class="carousel-control next" type="button" aria-label="Next image">›</button>
      </div>
      <div class="hero-copy">
        <img class="hero-logo" src="assets/images/victoria-falls-logo-refined.webp" alt="Victoria Falls refined logo" />
        <a class="text-link" href="#collection">View collection</a>
      </div>
    </section>

    <section id="collection" class="collection" aria-label="Collection products">
      <article class="product" data-product-id="tee">
        <button class="product-button" type="button" data-open-product="tee">
          <img src="assets/images/victoria-falls-stone-olive-tee-front.webp" alt="Victoria Falls heavyweight t-shirt front" />
          <span class="product-meta"><span>Heavyweight Tee</span><span>$35</span></span>
        </button>
      </article>
      <article class="product" data-product-id="mug">
        <button class="product-button" type="button" data-open-product="mug">
          <img src="assets/images/victoria-falls-enamel-mug-logo.webp" alt="Victoria Falls enamel mug with black rim" />
          <span class="product-meta"><span>Enamel Mug</span><span>$18</span></span>
        </button>
      </article>
      <article class="product" data-product-id="poster">
        <button class="product-button" type="button" data-open-product="poster">
          <img src="assets/images/victoria-falls-framed-poster-interior.webp" alt="Victoria Falls framed art poster in minimalist interior" />
          <span class="product-meta"><span>Fine Art Poster</span><span>$28</span></span>
        </button>
      </article>
    </section>
  </main>

  <div class="modal" id="productModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel">
      <button class="modal-close" type="button" data-close-modal aria-label="Close product modal">×</button>
      <div class="modal-media">
        <img id="modalImage" src="" alt="" />
      </div>
      <form id="productForm" class="modal-form">
        <p class="modal-kicker">Victoria Falls</p>
        <h2 id="modalTitle"></h2>
        <p id="modalPrice" class="modal-price"></p>

        <label>
          Colour
          <select id="variantSelect" name="variant"></select>
        </label>
        <label id="sizeField">
          Size
          <select id="sizeSelect" name="size">
            <option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
          </select>
        </label>
        <label>
          Quantity
          <input id="quantityInput" name="quantity" type="number" min="1" value="1" />
        </label>

        <div class="modal-actions">
          <button class="button dark" type="submit">Add to cart</button>
          <button class="button ghost" type="button" id="buyNowButton">Checkout</button>
        </div>
      </form>
    </section>
  </div>

  <aside id="cartDrawer" class="cart-drawer" aria-hidden="true">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <section class="cart-panel" aria-label="Shopping cart">
      <div class="cart-head">
        <h2>Cart</h2>
        <button id="closeCart" type="button" aria-label="Close cart">×</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div class="cart-total"><span>Total</span><strong id="cartTotal">$0</strong></div>
      <button id="drawerCheckout" class="button dark full" type="button">Checkout on WhatsApp</button>
      <p class="cart-note">Your order opens in WhatsApp with the keyword VictoriaFalls.</p>
    </section>
  </aside>

  <footer class="footer">
    <span>17.9243° S, 25.8560° E</span>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
